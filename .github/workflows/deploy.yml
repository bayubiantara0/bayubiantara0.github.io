name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject EmailJS credentials
        env:
          PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: |
          test -f assets/js/contact-form.js
          sed -i "s|EMAILJS_PUBLIC_KEY_PLACEHOLDER|${PUBLIC_KEY}|g" assets/js/contact-form.js
          sed -i "s|EMAILJS_SERVICE_ID_PLACEHOLDER|${SERVICE_ID}|g" assets/js/contact-form.js
          sed -i "s|EMAILJS_TEMPLATE_ID_PLACEHOLDER|${TEMPLATE_ID}|g" assets/js/contact-form.js
          if grep -qE "EMAILJS_(PUBLIC_KEY|SERVICE_ID|TEMPLATE_ID)_PLACEHOLDER" assets/js/contact-form.js; then
            echo "::error::EmailJS placeholders were not replaced. Check repository secrets."
            exit 1
          fi

      - name: Build site folder
        run: |
          mkdir -p dist
          cp index.html project-details.html dist/
          cp "CV_Bayu Biantara.pdf" dist/
          cp -r assets dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
